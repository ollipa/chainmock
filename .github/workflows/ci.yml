name: Test and lint

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    # Pre-release Pythons may break before dependencies support them.
    continue-on-error: ${{ endsWith(matrix.python-version, '-dev') }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          [
            "pypy-3.11",
            "pypy-3.12",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "3.15",
            "3.16-dev",
          ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # The default enable-cache: auto disables the cache for release events, which run this
        # workflow through publish.yml.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv tool install tox --with tox-uv --with tox-gh-actions

      - name: Run tests with tox
        run: tox

  lint:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        # The default enable-cache: auto disables the cache for release events, which run this
        # workflow through publish.yml.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check release metadata
        run: uv run python scripts/release.py check

      - name: Run linters
        run: make lint

  test-docs:
    name: Test documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        # The default enable-cache: auto disables the cache for release events, which run this
        # workflow through publish.yml.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Test building docs
        run: make docs

  # Single required status check for branch protection. It runs even when a needed job
  # fails or is skipped, because a skipped required check would count as passing.
  all-checks-pass:
    name: Tests and lints pass
    if: always()
    needs: [test, lint, test-docs]
    runs-on: ubuntu-latest

    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
