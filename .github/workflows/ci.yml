name: Test and lint

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    # Pre-release Pythons may break before dependencies support them.
    continue-on-error: ${{ endsWith(matrix.python-version, '-dev') }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          [
            "pypy-3.11",
            "pypy-3.12",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "3.15",
            "3.16-dev",
          ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install tox tox-gh-actions

      - name: Run tests with tox
        run: tox

  lint:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run linters
        run: make lint

  test-docs:
    name: Test documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run linters
        run: make docs

  # Single required status check for branch protection. It runs even when a needed job
  # fails or is skipped, because a skipped required check would count as passing.
  all-checks-pass:
    name: Tests and lints pass
    if: always()
    needs: [test, lint, test-docs]
    runs-on: ubuntu-latest

    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
